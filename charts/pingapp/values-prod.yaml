# Prod overrides — multiple replicas, tighter logs, PDB enabled.

replicaCount: 3

ingress:
  host: pingapp.local

config:
  logLevel: info

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

pdb:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
  # kube-prometheus-stack's Prometheus selects ServiceMonitors via this label by default.
  additionalLabels:
    release: kps

prometheusRule:
  enabled: true
  errorRateThreshold: 0.05
  errorRateFor: 2m
  additionalLabels:
    release: kps
