version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - revive
  settings:
    gosec:
      excludes:
        # G114: we set ReadHeaderTimeout explicitly; the http.Server is configured safely.
        - G114
  exclusions:
    generated: lax
    rules:
      # Test files may ignore errors on response bodies / encoders.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
