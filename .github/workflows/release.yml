name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pingapp

jobs:
  release:
    name: build, scan, sbom, release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: meta
        run: |
          version="${GITHUB_REF_NAME}"        # e.g. v0.1.0
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "semver=${version#v}" >> "$GITHUB_OUTPUT"  # 0.1.0

      - name: Extract changelog section for this version
        run: |
          awk -v ver="${{ steps.meta.outputs.semver }}" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${{ steps.meta.outputs.version }}" > RELEASE_NOTES.md
          fi
          echo "----- release notes -----"; cat RELEASE_NOTES.md

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Generate SBOM (Syft, SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: pingapp-${{ steps.meta.outputs.version }}.spdx.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (semver + sha)
        run: |
          docker push ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.meta.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: pingapp-${{ steps.meta.outputs.version }}.spdx.json
